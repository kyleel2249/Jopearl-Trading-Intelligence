name: Deploy JPTI to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run static and integration checks
        run: npm run check
      - name: Run automated regression tests
        run: npm test
      - name: Build and verify Cloudflare Pages output
        run: npm run build:pages
        env:
          VITE_APP_NAME: JPTI
          VITE_APP_ENV: production
          VITE_API_BASE_URL: ""
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name jpti

      - name: Verify deployed Bitget markets, tickers, candles and symbol switching
        run: npm run verify:bitget:live
        env:
          JPTI_PAGES_URL: ${{ vars.CLOUDFLARE_PAGES_URL || 'https://jpti.pages.dev' }}
