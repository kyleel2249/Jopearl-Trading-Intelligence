name: Deploy JPTI to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run static and integration checks
        run: npm run check
      - name: Verify live chart-intelligence engine
        run: npm run verify:chart-intelligence
      - name: Run automated regression tests
        run: npm test
      - name: Validate scheduled paper trading Worker bundle
        run: npx --no-install wrangler deploy --dry-run --config workers/wrangler.toml
      - name: Prepare GitHub-managed Cloudflare variables and secrets
        run: node scripts/sync-cloudflare-env.mjs
        env:
          CLOUDFLARE_PAGES_PROJECT: jopearl-trading-intelligence
          # Listed one by one on purpose: toJSON(vars) prints every repository variable in the log.
          # Add any other runtime variable to JPTI_CLOUDFLARE_VARS_JSON.
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS }}
          VITE_ENABLE_CRASH_REPORTING: ${{ vars.VITE_ENABLE_CRASH_REPORTING }}
          VITE_ENABLE_PERFORMANCE_MONITORING: ${{ vars.VITE_ENABLE_PERFORMANCE_MONITORING }}
          VITE_ENABLE_CONFIG_DIAGNOSTICS: ${{ vars.VITE_ENABLE_CONFIG_DIAGNOSTICS }}
          JPTI_TRADING_MODE: ${{ vars.JPTI_TRADING_MODE }}
          JPTI_ENABLE_LIVE_TRADING: ${{ vars.JPTI_ENABLE_LIVE_TRADING }}
          JPTI_ENABLE_BITGET_CONSENSUS: ${{ vars.JPTI_ENABLE_BITGET_CONSENSUS }}
          JPTI_ENABLE_ALPHAVANTAGE_CONSENSUS: ${{ vars.JPTI_ENABLE_ALPHAVANTAGE_CONSENSUS }}
          JPTI_ALERT_MIN_SEVERITY: ${{ vars.JPTI_ALERT_MIN_SEVERITY }}
          JPTI_ALERT_ON_WATCH: ${{ vars.JPTI_ALERT_ON_WATCH }}
          JPTI_ALERT_MAX_CONSECUTIVE_LOSSES: ${{ vars.JPTI_ALERT_MAX_CONSECUTIVE_LOSSES }}
          JPTI_ALERT_DAILY_LOSS_R: ${{ vars.JPTI_ALERT_DAILY_LOSS_R }}
          JPTI_ALERT_DRAWDOWN_R: ${{ vars.JPTI_ALERT_DRAWDOWN_R }}
          JPTI_CORS_ORIGINS: ${{ vars.JPTI_CORS_ORIGINS }}
          JPTI_CORS_ORIGINS_EXTRA: ${{ vars.JPTI_CORS_ORIGINS_EXTRA }}
          JPTI_EVENT_RISK_FAIL_CLOSED: ${{ vars.JPTI_EVENT_RISK_FAIL_CLOSED }}
          JPTI_CROSS_VENUE_OUTLIER_PERCENT: ${{ vars.JPTI_CROSS_VENUE_OUTLIER_PERCENT }}
          JPTI_TRUST_PROXY: ${{ vars.JPTI_TRUST_PROXY }}
          JPTI_CLOUDFLARE_VARS_JSON: ${{ vars.JPTI_CLOUDFLARE_VARS_JSON }}
          JPTI_CLOUDFLARE_SECRETS_JSON: ${{ secrets.JPTI_CLOUDFLARE_SECRETS_JSON }}

      # Cloudflare Pages only accepts its default root Wrangler config path.
      # Activate the generated config in this ephemeral runner; never commit it.
      - name: Activate generated Cloudflare Pages configuration
        run: cp .wrangler-ci.toml wrangler.toml

      - name: Build and verify Cloudflare Pages output
        run: npm run build:pages
        env:
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME || 'JPTI' }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV || 'production' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL || '' }}
          VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS || 'true' }}
          VITE_ENABLE_CRASH_REPORTING: ${{ vars.VITE_ENABLE_CRASH_REPORTING || 'true' }}
          VITE_ENABLE_PERFORMANCE_MONITORING: ${{ vars.VITE_ENABLE_PERFORMANCE_MONITORING || 'true' }}
          VITE_ENABLE_CONFIG_DIAGNOSTICS: ${{ vars.VITE_ENABLE_CONFIG_DIAGNOSTICS || 'true' }}
      - name: Validate sequence-aware market stream collector bundle
        run: npx --no-install wrangler deploy --dry-run --config workers/market-stream-collector.wrangler.toml
      - name: Validate autonomous department scheduler bundle
        run: npx --no-install wrangler deploy --dry-run --config workers/department-intelligence-scheduler.wrangler.toml
      - name: Validate edge intelligence scheduler
        run: npx --no-install wrangler deploy --dry-run --config workers/edge-intelligence-scheduler.wrangler.toml

      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add it under repository Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID. Add it under repository Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "Cloudflare deployment credentials are present."

      - name: Apply Cloudflare D1 migrations
        run: npx --no-install wrangler d1 migrations apply JPTI_DB --remote --config ./wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Synchronize encrypted Cloudflare Pages secrets
        run: |
          set -euo pipefail
          if [ -f .jpti-pages-secrets.json ]; then
            npx --no-install wrangler pages secret bulk .jpti-pages-secrets.json --project-name "jopearl-trading-intelligence"
            echo "Encrypted Pages secrets synchronized."
          else
            echo "No JPTI_CLOUDFLARE_SECRETS_JSON supplied; existing Cloudflare secrets were left unchanged."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy sequence-aware market stream collector
        run: npx --no-install wrangler deploy --config workers/market-stream-collector.wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Cloudflare Pages
        run: npx --no-install wrangler pages deploy dist --project-name "jopearl-trading-intelligence" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy autonomous department scheduler
        run: npx --no-install wrangler deploy --config workers/department-intelligence-scheduler.wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify private access on the deployed sites
        run: npm run verify:private-auth
        env:
          JPTI_DEPLOY_URL: https://jopearl-trading-intelligence.pages.dev
          JPTI_PAGES_URL: ${{ vars.CLOUDFLARE_PAGES_URL }}
          JPTI_JOURNAL_TOKEN: ${{ secrets.JPTI_JOURNAL_TOKEN || secrets.JPTI_API_TOKEN }}

      - name: Verify deployed Bitget markets, tickers, candles and symbol switching
        run: npm run verify:bitget:live
        env:
          JPTI_PAGES_URL: https://jopearl-trading-intelligence.pages.dev
