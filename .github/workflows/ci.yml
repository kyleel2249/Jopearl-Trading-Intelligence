name: JPTI CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Audit dependency tree
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/jpti-npm-audit.json" || true
          node --input-type=module -e "import fs from 'node:fs'; const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/jpti-npm-audit.json','utf8')); console.log('NPM_AUDIT_SUMMARY', JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log('NPM_AUDIT_DETAIL', name, JSON.stringify({severity:item.severity,range:item.range,via:item.via,nodes:item.nodes,fixAvailable:item.fixAvailable}));"
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
