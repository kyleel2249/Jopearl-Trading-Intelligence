name: JPTI CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Audit dependency tree
        run: npm audit --audit-level=low
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run smoke
