name: Android debug APK build

on:
  # The primary cross-platform workflow builds Android on pushes and pull requests.
  # Keep this dedicated debug/release package workflow available for manual runs,
  # avoiding duplicate concurrent Gradle downloads and Maven Central rate limiting.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build JPTI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate frontend environment configuration
        run: npm run env:check

      - name: Build web application
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.CLOUDFLARE_PAGES_URL || 'https://jpti.pages.dev' }}

      - name: Ensure Android project exists
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Build Android debug and release variants
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease; then exit 0; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            delay=$((attempt * 30))
            echo "Gradle dependency/build attempt $attempt failed; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Verify Android APK outputs
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jpti-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # The APK is published as a GitHub Actions artifact. Production web hosting remains Cloudflare Pages.
      - name: Publish APK into android/app/downloads (opt-in, main only)
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.JPTI_ANDROID_PUBLISH_FROM_DEBUG_WORKFLOW == 'true' }}
        run: scripts/publish-apk.sh android/app/build/outputs/apk/debug/app-debug.apk JPTI-Android-debug.apk

