name: JPTI Continuous Market Data Replication

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpti-market-data-replication
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REPLICATION_URL: ${{ vars.JPTI_REPLICATION_URL }}
      # Same precedence as the Pages Function, so both secrets may be set.
      JPTI_API_TOKEN: ${{ secrets.JPTI_JOURNAL_TOKEN || secrets.JPTI_API_TOKEN }}
    steps:
      - name: Validate replication endpoint and credentials
        id: config
        run: |
          set -euo pipefail
          if [ -z "$REPLICATION_URL" ] || [ -z "$JPTI_API_TOKEN" ]; then
            echo "::notice title=Replication not configured::Set the variable JPTI_REPLICATION_URL (Pages URL ending in /api/replication) and the secret JPTI_JOURNAL_TOKEN or JPTI_API_TOKEN to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$REPLICATION_URL" in
            https://*) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Replication URL must use HTTPS."; exit 1 ;;
          esac
      - name: Run bounded exchange replication cycle
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 --max-time 240 \
            --retry 2 --retry-delay 8 --retry-all-errors \
            -X POST "$REPLICATION_URL" \
            -H "content-type: application/json" \
            -H "x-jpti-api-token: $JPTI_API_TOKEN" \
            --data '{"includeCandles":true,"marketLimit":1,"candleLimit":80,"timeframes":["1m","5m","1h"]}' \
            --output replication-result.json
          cat replication-result.json
          node -e "const r=require('./replication-result.json'); if(!r.runId || !['completed','partial'].includes(r.status)) process.exit(1); console.log('Replication run:',r.runId,'status:',r.status,'inserted:',r.counts?.inserted ?? 0);"

      - name: Replicate order books, trades, funding, open interest and liquidation events
        if: steps.config.outputs.ready == 'true'
        run: |
          set -euo pipefail
          MICROSTRUCTURE_URL="${REPLICATION_URL%/api/replication}/api/replication/microstructure"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 --max-time 180 \
            --retry 1 --retry-delay 5 \
            -X POST "$MICROSTRUCTURE_URL" \
            -H "content-type: application/json" \
            -H "x-jpti-api-token: $JPTI_API_TOKEN" \
            --data '{"symbols":["BTC/USDT"],"marketType":"usdt-m","kinds":["orderbook","trade","funding","open_interest","liquidation"],"maxRequests":24,"depthLimit":20,"tradeLimit":50}' \
            --output microstructure-result.json
          cat microstructure-result.json
          node -e "const r=require('./microstructure-result.json'); if(!r.runId || !['completed','partial'].includes(r.status)) process.exit(1); console.log('Microstructure run:',r.runId,'status:',r.status,'inserted:',r.inserted ?? 0,'unsupported:',r.coverage?.unsupported ?? 0);"
