name: JPTI Continuous Market Data Replication

on:
  schedule:
    # Avoid minute zero, when GitHub documents higher schedule congestion.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpti-market-data-replication
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REPLICATION_URL: https://jopearl-trading-intelligence.pages.dev/api/replication
      # Match Pages Functions token precedence. Never print or echo this value.
      JPTI_API_TOKEN: ${{ secrets.JPTI_JOURNAL_TOKEN || secrets.JPTI_API_TOKEN }}
    steps:
      - name: Check out JPTI source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate replication endpoint and credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${REPLICATION_URL//[[:space:]]/}" ]; then
            echo "::error title=Replication is not configured::Check the pinned production REPLICATION_URL in this workflow."
            exit 1
          fi
          if [ -z "${JPTI_API_TOKEN//[[:space:]]/}" ]; then
            echo "::error title=Replication credentials are missing::Add repository secret JPTI_JOURNAL_TOKEN (recommended) or JPTI_API_TOKEN. Do not paste the token into workflow files."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const raw = process.env.REPLICATION_URL;
          let url;
          try { url = new URL(raw); } catch { throw new Error('REPLICATION_URL must be a valid absolute URL.'); }
          const allowedHosts = new Set(['jopearl-trading-intelligence.pages.dev']);
          if (url.protocol !== 'https:') throw new Error('REPLICATION_URL must use HTTPS.');
          if (!allowedHosts.has(url.hostname.toLowerCase())) throw new Error('REPLICATION_URL host is not the approved JPTI production Cloudflare Pages origin.');
          if (url.pathname !== '/api/replication' || url.search || url.hash || url.username || url.password) {
            throw new Error('REPLICATION_URL must be the exact /api/replication endpoint without query, fragment or embedded credentials.');
          }
          console.log('Replication endpoint configuration validated for', url.origin + url.pathname);
          NODE
      - name: Record start of required Bitget replication window
        id: bitget_replication_start
        shell: bash
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%S.%3NZ')" >> "$GITHUB_OUTPUT"

      - name: Acquire required Bitget market data from the GitHub runner and push validated observations to D1
        shell: bash
        env:
          # Bitget is the primary venue. Other exchange restrictions must not starve its D1 freshness.
          JPTI_REPLICATION_EXCHANGES: bitget
          JPTI_REPLICATION_MARKET_LIMIT: '1'
          JPTI_REPLICATION_CATALOG_LIMIT: '8'
          JPTI_REPLICATION_CANDLE_LIMIT: '80'
          JPTI_REPLICATION_TIMEFRAMES: '1m,5m,1h'
          JPTI_REPLICATION_REQUIRE_BITGET_SPOT: 'true'
        run: |
          set -euo pipefail
          node scripts/replicate-market-data.mjs

      - name: Supplement cross-exchange reference observations (best effort)
        shell: bash
        continue-on-error: true
        env:
          # Keep Binance, Bybit and OKX available for consensus when their regional routes respond.
          JPTI_REPLICATION_EXCHANGES: binance,bybit,okx
          JPTI_REPLICATION_MARKET_LIMIT: '1'
          JPTI_REPLICATION_CANDLE_LIMIT: '60'
          JPTI_REPLICATION_TIMEFRAMES: '1m,5m,1h'
        run: |
          set -euo pipefail
          node scripts/replicate-market-data.mjs
      - name: Replicate order books, trades, funding, open interest and liquidation events
        shell: bash
        run: |
          set -euo pipefail
          MICROSTRUCTURE_URL="${REPLICATION_URL%/api/replication}/api/replication/microstructure"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 20 --max-time 180 \
            --retry 1 --retry-delay 5 \
            -X POST "$MICROSTRUCTURE_URL" \
            -H "content-type: application/json" \
            -H "x-jpti-api-token: $JPTI_API_TOKEN" \
            --data '{"symbols":["BTC/USDT"],"marketType":"usdt-m","kinds":["orderbook","trade","funding","open_interest","liquidation"],"maxRequests":24,"depthLimit":20,"tradeLimit":50}' \
            --output microstructure-result.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('microstructure-result.json', 'utf8'));
          if (!r.runId || !['completed', 'partial'].includes(r.status)) {
            throw new Error('Microstructure API did not return a completed or partial run: ' + JSON.stringify({ status: r.status, error: r.error }));
          }
          console.log('Microstructure run:', r.runId, 'status:', r.status, 'inserted:', r.inserted ?? 0, 'unsupported:', r.coverage?.unsupported ?? 0);
          if (r.status === 'partial') console.warn('::warning title=Partial microstructure replication::Review source errors and unsupported coverage in the returned run.');
          NODE

      - name: Verify durable Bitget replication freshness
        shell: bash
        env:
          REPLICATION_STARTED_AT: ${{ steps.bitget_replication_start.outputs.started_at }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const endpoint = process.env.REPLICATION_URL;
          const replicationStartedAt = Date.parse(process.env.REPLICATION_STARTED_AT || '');
          if (!Number.isFinite(replicationStartedAt)) throw new Error('Bitget replication start timestamp is missing.');
          const response = await fetch(endpoint, { headers: { accept: 'application/json' }, signal: AbortSignal.timeout(20000) });
          if (!response.ok) throw new Error('Replication status endpoint returned HTTP ' + response.status);
          const status = await response.json();
          const spot = (status.coverage || []).find(row => row.exchange === 'bitget' && row.market_type === 'spot');
          const receivedAt = Date.parse(spot?.last_received_at || '');
          const ageMs = Date.now() - receivedAt;
          if (!Number.isFinite(receivedAt) || receivedAt < replicationStartedAt - 5000 || ageMs < -5000 || ageMs > 10 * 60 * 1000) {
            throw new Error('Bitget Spot D1 observations are not fresh enough. Latest received_at=' + (spot?.last_received_at || 'missing') + ', ageMs=' + ageMs);
          }
          if (!(Number(spot.observations) > 0)) throw new Error('Bitget Spot replication has no durable observations.');
          console.log('Bitget Spot D1 freshness verified:', spot.last_received_at, 'ageMs:', ageMs, 'observations:', spot.observations);
          NODE
