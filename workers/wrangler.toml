name = "jpti-paper-scheduler"
main = "paper-scheduler.js"
compatibility_date = "2026-11-24"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "JPTI_DB"
database_name = "jopearl-trading-intelligence-db"
database_id = "3c0a6ec7-8d89-41e3-a1c7-16bb3391f841"
migrations_dir = "../migrations/d1"

# Cron triggers are intentionally omitted here. Wrangler leaves the currently deployed
# schedules unchanged when triggers are undefined. This account is at its 5-trigger Free limit.

[[durable_objects.bindings]]
name = "MARKET_STREAMS"
class_name = "MarketStreamHub"
script_name = "jpti-market-stream-collector"
