name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'integrations/t-bots/**'
      - 'integrations/t-bots-adapter/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile-android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'api/**'
      - 'public/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/mobile-android.yml'
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Validate before packaging
        run: npm run check && npm test
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "jpti-${VERSION}-${GITHUB_SHA::7}-debug.apk"
          echo "APK_FILE=jpti-${VERSION}-${GITHUB_SHA::7}-debug.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: jpti-android-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
      - name: Publish latest APK release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest "$APK_FILE" --prerelease --target "$GITHUB_SHA" \
            --title "JPTI Android (debug) ${GITHUB_SHA::7}" \
            --notes "Automatically built from main @ ${GITHUB_SHA}. Debug-signed APK for testing; sideload on Android."
